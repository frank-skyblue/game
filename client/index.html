<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PvP Arena</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111827;
        --line: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #1d4ed8;
        --accent-hover: #2563eb;
        --warn: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(ellipse at top, #1e293b 0%, transparent 55%),
          linear-gradient(180deg, #0b1220 0%, #020617 100%);
        color: var(--text);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      #lobby {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      #lobby.hidden {
        display: none;
      }

      .panel {
        width: min(520px, 100%);
        padding: 36px 32px 28px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.4rem, 6vw, 3.2rem);
        letter-spacing: 0.04em;
        font-weight: 700;
      }

      .tagline {
        margin: 10px 0 28px;
        color: var(--muted);
        line-height: 1.4;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: #cbd5e1;
        font-size: 0.9rem;
      }

      .field {
        margin-bottom: 16px;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0f172a;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
      }

      input:focus {
        outline: 2px solid #3b82f6;
        outline-offset: 1px;
      }

      #roomCode {
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 8px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--accent);
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: var(--accent-hover);
      }

      button:focus-visible {
        outline: 2px solid #93c5fd;
        outline-offset: 2px;
      }

      button.secondary {
        background: #1e293b;
        border: 1px solid var(--line);
      }

      button.secondary:hover,
      button.secondary:focus-visible {
        background: #334155;
      }

      .weapon-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .weapon-option {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0f172a;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      .weapon-option:hover,
      .weapon-option:focus-visible {
        background: #1e293b;
      }

      .weapon-option[aria-pressed="true"] {
        border-color: #3b82f6;
        background: #172554;
        box-shadow: inset 0 0 0 1px #3b82f6;
      }

      .weapon-option .weapon-name {
        font-size: 1rem;
        font-weight: 700;
      }

      .weapon-option .weapon-stats {
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.35;
      }

      #status {
        min-height: 1.4em;
        margin: 16px 0 0;
        color: var(--warn);
        font-size: 0.95rem;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      #game.hidden {
        display: none;
      }

      #editor.hidden {
        display: none;
      }

      #editor {
        min-height: 100%;
        overflow: auto;
        padding: 20px 24px 40px;
      }

      .editor-shell {
        width: min(1200px, 100%);
        margin: 0 auto;
      }

      .editor-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 18px;
      }

      .editor-header h1 {
        margin: 6px 0 0;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
      }

      .editor-back {
        color: #93c5fd;
        text-decoration: none;
        font-size: 0.95rem;
      }

      .editor-back:hover,
      .editor-back:focus-visible {
        text-decoration: underline;
      }

      .editor-tagline {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .editor-status {
        margin: 0;
        color: var(--warn);
        max-width: 320px;
        text-align: right;
      }

      .editor-layout {
        display: grid;
        grid-template-columns: minmax(240px, 300px) 1fr;
        gap: 18px;
        align-items: start;
      }

      .editor-sidebar {
        padding: 18px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .editor-hint {
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.4;
        margin: 0 0 14px;
      }

      .tool-row,
      .editor-actions,
      .load-row {
        display: grid;
        gap: 8px;
      }

      .tool-row {
        grid-template-columns: 1fr 1fr 1fr;
        margin-bottom: 12px;
      }

      .editor-actions {
        margin-bottom: 16px;
      }

      .load-row {
        grid-template-columns: 1fr auto;
      }

      .tool-btn {
        background: #0f172a;
        border: 1px solid var(--line);
      }

      .tool-btn[aria-pressed="true"] {
        background: #172554;
        border-color: #3b82f6;
      }

      .editor-meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .editor-canvas-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #020617;
        padding: 12px;
      }

      #editorCanvas {
        display: block;
        max-width: 100%;
        height: auto;
        cursor: crosshair;
        touch-action: none;
      }

      select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0f172a;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
      }

      .lobby-links {
        margin-top: 18px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      .lobby-links a {
        color: #93c5fd;
        text-decoration: none;
      }

      .lobby-links a:hover,
      .lobby-links a:focus-visible {
        text-decoration: underline;
      }

      @media (max-width: 860px) {
        .editor-layout {
          grid-template-columns: 1fr;
        }

        .editor-header {
          flex-direction: column;
        }

        .editor-status {
          text-align: left;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <div class="panel">
        <h1>PVP ARENA</h1>
        <p class="tagline">Top-down deathmatch. Create a room, share the code, and keep the host tab open.</p>

        <div class="field">
          <label for="playerName">Name</label>
          <input id="playerName" maxlength="16" autocomplete="nickname" aria-label="Player name" />
        </div>

        <div class="field">
          <label id="weaponLabel">Weapon</label>
          <div
            class="weapon-grid"
            id="weaponPicker"
            role="group"
            aria-labelledby="weaponLabel"
          >
            <button
              type="button"
              class="weapon-option"
              data-weapon="rifle"
              aria-pressed="true"
              aria-label="Rifle, 30 magazine, 120 reserve, medium damage, medium fire rate"
            >
              <span class="weapon-name">Rifle</span>
              <span class="weapon-stats">30 / 120 · med dmg · med rate</span>
            </button>
            <button
              type="button"
              class="weapon-option"
              data-weapon="smg"
              aria-pressed="false"
              aria-label="SMG, 60 magazine, 240 reserve, small damage, quick fire rate"
            >
              <span class="weapon-name">SMG</span>
              <span class="weapon-stats">60 / 240 · low dmg · fast rate</span>
            </button>
            <button
              type="button"
              class="weapon-option"
              data-weapon="sniper"
              aria-pressed="false"
              aria-label="Sniper, 10 magazine, 80 reserve, big damage, low fire rate"
            >
              <span class="weapon-name">Sniper</span>
              <span class="weapon-stats">10 / 80 · high dmg · slow rate</span>
            </button>
            <button
              type="button"
              class="weapon-option"
              data-weapon="sword"
              aria-pressed="false"
              aria-label="Sword, infinite ammo, big damage, medium fire rate"
            >
              <span class="weapon-name">Sword</span>
              <span class="weapon-stats">∞ · high dmg · med rate · melee</span>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="botCount">Bots (host only)</label>
          <input
            id="botCount"
            type="number"
            min="0"
            max="7"
            step="1"
            value="2"
            aria-label="Number of bots to spawn when creating a room"
          />
        </div>

        <div class="field">
          <label for="mapSelect">Arena map (host only)</label>
          <select id="mapSelect" aria-label="Arena map">
            <option value="builtin">Classic (built-in)</option>
          </select>
        </div>

        <div class="field">
          <label for="roomCode">Room code</label>
          <input
            id="roomCode"
            maxlength="6"
            autocomplete="off"
            spellcheck="false"
            aria-label="Room code"
            placeholder="ABC123"
          />
        </div>

        <div class="actions">
          <button id="createBtn" type="button" aria-label="Create room">Create room</button>
          <button id="joinBtn" class="secondary" type="button" aria-label="Join room">Join room</button>
        </div>

        <div class="lobby-links">
          <a href="/editor" aria-label="Open level editor">Level editor</a>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </div>

    <div id="editor" class="hidden"></div>

    <div id="game" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

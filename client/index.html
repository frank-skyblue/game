<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PvP Arena</title>
    <style>
      :root {
        --bg: #060b16;
        --panel: #0c1528;
        --line: #1e3a5f;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #0284c7;
        --accent-hover: #0ea5e9;
        --accent-glow: rgba(56, 189, 248, 0.35);
        --warn: #fbbf24;
        --cyan: #67e8f9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        z-index: -1;
        background:
          radial-gradient(ellipse 50% 40% at 20% 15%, rgba(14, 165, 233, 0.22), transparent 55%),
          radial-gradient(ellipse 45% 35% at 85% 70%, rgba(56, 189, 248, 0.12), transparent 50%),
          radial-gradient(ellipse 60% 50% at 50% 100%, rgba(30, 58, 95, 0.45), transparent 60%),
          linear-gradient(180deg, #0a1224 0%, #060b16 45%, #020617 100%);
        animation: lobby-drift 18s ease-in-out infinite alternate;
      }

      @keyframes lobby-drift {
        from {
          transform: translate3d(-1.5%, -1%, 0) scale(1.02);
        }
        to {
          transform: translate3d(1.5%, 1.5%, 0) scale(1.06);
        }
      }

      #lobby {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      #lobby.hidden {
        display: none;
      }

      .panel {
        width: min(520px, 100%);
        padding: 36px 32px 28px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid color-mix(in srgb, var(--cyan) 35%, var(--line));
        border-radius: 14px;
        box-shadow:
          0 0 0 1px rgba(14, 165, 233, 0.08),
          0 24px 60px rgba(0, 0, 0, 0.45),
          0 0 48px var(--accent-glow);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.6rem, 6.5vw, 3.4rem);
        letter-spacing: 0.06em;
        font-weight: 700;
        background: linear-gradient(120deg, #f8fafc 10%, #67e8f9 55%, #38bdf8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.35));
      }

      .tagline {
        margin: 10px 0 28px;
        color: var(--muted);
        line-height: 1.45;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: #cbd5e1;
        font-size: 0.9rem;
      }

      .field {
        margin-bottom: 16px;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #07101f;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
      }

      #roomCode {
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 8px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 12px 14px;
        background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease;
      }

      button:hover,
      button:focus-visible {
        background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 100%);
        box-shadow: 0 0 20px var(--accent-glow);
        transform: translateY(-1px);
      }

      button:focus-visible {
        outline: 2px solid #67e8f9;
        outline-offset: 2px;
      }

      button.secondary {
        background: #122033;
        border: 1px solid var(--line);
      }

      button.secondary:hover,
      button.secondary:focus-visible {
        background: #1a2f4a;
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.18);
      }

      .weapon-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .weapon-option {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #07101f;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }

      .weapon-option:hover,
      .weapon-option:focus-visible {
        background: #0f1c30;
        border-color: #38bdf8;
      }

      .weapon-option[aria-pressed="true"] {
        border-color: #38bdf8;
        background: #0b2740;
        box-shadow:
          inset 0 0 0 1px rgba(103, 232, 249, 0.35),
          0 0 18px rgba(56, 189, 248, 0.28);
      }

      .weapon-option .weapon-name {
        font-size: 1rem;
        font-weight: 700;
      }

      .weapon-option .weapon-stats {
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.35;
      }

      #status {
        min-height: 1.4em;
        margin: 16px 0 0;
        color: var(--warn);
        font-size: 0.95rem;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #060b16;
      }

      #game.hidden {
        display: none;
      }

      #editor.hidden {
        display: none;
      }

      #editor {
        min-height: 100%;
        overflow: auto;
        padding: 20px 24px 40px;
      }

      .editor-shell {
        width: min(1200px, 100%);
        margin: 0 auto;
      }

      .editor-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 18px;
      }

      .editor-header h1 {
        margin: 6px 0 0;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
      }

      .editor-back {
        color: #7dd3fc;
        text-decoration: none;
        font-size: 0.95rem;
      }

      .editor-back:hover,
      .editor-back:focus-visible {
        text-decoration: underline;
      }

      .editor-tagline {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .editor-status {
        margin: 0;
        color: var(--warn);
        max-width: 320px;
        text-align: right;
      }

      .editor-layout {
        display: grid;
        grid-template-columns: minmax(240px, 300px) 1fr;
        gap: 18px;
        align-items: start;
      }

      .editor-sidebar {
        padding: 18px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .editor-hint {
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.4;
        margin: 0 0 14px;
      }

      .tool-row,
      .editor-actions,
      .load-row {
        display: grid;
        gap: 8px;
      }

      .tool-row {
        grid-template-columns: 1fr 1fr 1fr;
        margin-bottom: 12px;
      }

      .editor-actions {
        margin-bottom: 16px;
      }

      .load-row {
        grid-template-columns: 1fr auto;
      }

      .tool-btn {
        background: #0f172a;
        border: 1px solid var(--line);
      }

      .tool-btn[aria-pressed="true"] {
        background: #0b2740;
        border-color: #38bdf8;
        box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
      }

      .editor-meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .editor-canvas-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #020617;
        padding: 12px;
      }

      #editorCanvas {
        display: block;
        max-width: 100%;
        height: auto;
        cursor: crosshair;
        touch-action: none;
      }

      select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0f172a;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
      }

      .lobby-links {
        margin-top: 18px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      .lobby-links a {
        color: #7dd3fc;
        text-decoration: none;
      }

      .lobby-links a:hover,
      .lobby-links a:focus-visible {
        text-decoration: underline;
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
      }

      @media (max-width: 860px) {
        .editor-layout {
          grid-template-columns: 1fr;
        }

        .editor-header {
          flex-direction: column;
        }

        .editor-status {
          text-align: left;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <div class="panel">
        <h1>PVP ARENA</h1>
        <p class="tagline">Neon spirit deathmatch. Create a room, share the code, and keep the host tab open.</p>

        <div class="field">
          <label for="playerName">Name</label>
          <input id="playerName" maxlength="16" autocomplete="nickname" aria-label="Player name" />
        </div>

        <div class="field">
          <label id="weaponLabel">Weapon</label>
          <div
            class="weapon-grid"
            id="weaponPicker"
            role="group"
            aria-labelledby="weaponLabel"
          >
            <button
              type="button"
              class="weapon-option"
              data-weapon="rifle"
              aria-pressed="true"
              aria-label="Rifle, 30 magazine, 120 reserve, medium damage, medium fire rate"
            >
              <span class="weapon-name">Rifle</span>
              <span class="weapon-stats">30 / 120 · med dmg · med rate</span>
            </button>
            <button
              type="button"
              class="weapon-option"
              data-weapon="smg"
              aria-pressed="false"
              aria-label="SMG, 60 magazine, 240 reserve, small damage, quick fire rate"
            >
              <span class="weapon-name">SMG</span>
              <span class="weapon-stats">60 / 240 · low dmg · fast rate</span>
            </button>
            <button
              type="button"
              class="weapon-option"
              data-weapon="sniper"
              aria-pressed="false"
              aria-label="Sniper, 10 magazine, 80 reserve, big damage, low fire rate"
            >
              <span class="weapon-name">Sniper</span>
              <span class="weapon-stats">10 / 80 · high dmg · slow rate</span>
            </button>
            <button
              type="button"
              class="weapon-option"
              data-weapon="sword"
              aria-pressed="false"
              aria-label="Sword, infinite ammo, big damage, medium fire rate"
            >
              <span class="weapon-name">Sword</span>
              <span class="weapon-stats">∞ · high dmg · med rate · melee</span>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="botCount">Bots (host only)</label>
          <input
            id="botCount"
            type="number"
            min="0"
            max="7"
            step="1"
            value="2"
            aria-label="Number of bots to spawn when creating a room"
          />
        </div>

        <div class="field">
          <label for="mapSelect">Arena map (host only)</label>
          <select id="mapSelect" aria-label="Arena map">
            <option value="builtin">Classic (built-in)</option>
          </select>
        </div>

        <div class="field">
          <label for="roomCode">Room code</label>
          <input
            id="roomCode"
            maxlength="6"
            autocomplete="off"
            spellcheck="false"
            aria-label="Room code"
            placeholder="ABC123"
          />
        </div>

        <div class="actions">
          <button id="createBtn" type="button" aria-label="Create room">Create room</button>
          <button id="joinBtn" class="secondary" type="button" aria-label="Join room">Join room</button>
        </div>

        <div class="lobby-links">
          <a href="/editor" aria-label="Open level editor">Level editor</a>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </div>

    <div id="editor" class="hidden"></div>

    <div id="game" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
